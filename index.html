<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="#" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid's Math Task Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:wght@400..800&family=Schoolbell&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Nunito", "sans-serif"],
              display: ["Fredoka", "sans-serif"],
              handwritten: ["Schoolbell", "cursive"],
            },
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
              accent: {
                50: "#fff1f2",
                100: "#ffe4e6",
                200: "#fecdd3",
                300: "#fda4af",
                400: "#fb7185",
                500: "#f43f5e",
                600: "#e11d48",
                700: "#be123c",
                800: "#9f1239",
                900: "#881337",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --a4-width: 210mm;
        --a4-height: 297mm;
        --print-margin: 1.5cm;
      }

      body {
        font-family: "Nunito", sans-serif;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Fredoka", sans-serif;
      }

      .font-handwritten {
        font-family: "Schoolbell", cursive;
      }

      .material-symbols-rounded {
        width: 1em;
        height: 1em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 48;
      }

      /* Playful check-pop animation: scale up with overshoot then settle */
      @keyframes check-pop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        40% {
          transform: scale(1.4);
          opacity: 1;
        }
        60% {
          transform: scale(0.85);
        }
        80% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Ring fill animation for the circle behind the check */
      @keyframes ring-fill {
        0% {
          stroke-dashoffset: 100;
          opacity: 0.3;
        }
        50% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      /* Gentle shake for wrong answers */
      @keyframes wrong-shake {
        0%, 100% { transform: translateX(0); }
        15% { transform: translateX(-4px) rotate(-2deg); }
        30% { transform: translateX(4px) rotate(2deg); }
        45% { transform: translateX(-3px) rotate(-1deg); }
        60% { transform: translateX(3px) rotate(1deg); }
        75% { transform: translateX(-1px); }
      }

      .animate-check-pop {
        animation: check-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .animate-ring-fill {
        animation: ring-fill 0.5s ease-out forwards;
      }

      .animate-wrong-shake {
        animation: wrong-shake 0.5s ease-in-out;
      }

      /* Print preview frame styling */
      .print-preview-frame {
        width: var(--a4-width);
        height: var(--a4-height);
        margin: 0 auto;
        background: white;
        position: relative;
        overflow: hidden;
      }

      .dark .print-preview-frame {
        background: white; /* Always white for print preview */
      }

      @media screen {
        .print-preview-wrapper {
          display: flex;
          justify-content: center;
          overflow: auto;
        }

        .print-preview-frame {
          border-radius: 1rem;
          box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06),
            0 8px 24px -12px rgba(15, 23, 42, 0.25);
          transform-origin: top center;
        }

        /* Below desktop the rigid A4 frame overflows the viewport, so the
           preview goes fluid. Printing is unaffected: the print rules below
           reset the frame to a full page again. */
        @media (max-width: 1279px) {
          .print-preview-frame {
            width: 100%;
            height: auto;
            min-height: 50vh;
          }
        }
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes sheet-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fade-in 0.2s ease-out forwards;
      }

      .animate-sheet-up {
        animation: sheet-up 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }

        /* Outlined, lighter-weight icons drastically cut ink use in
           black-and-white print mode versus the filled screen glyphs. */
        .material-symbols-rounded {
          font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 40 !important;
        }

        body {
          margin: 0;
          padding: 0;
          background: white !important;
          color: black !important;
        }

        * {
          background: transparent !important;
          box-shadow: none !important;
          text-shadow: none !important;
          color: black !important;
        }

        .no-print {
          display: none !important;
        }

        .print-preview-wrapper {
          padding: 0 !important;
          border-radius: 0 !important;
          display: block !important;
        }

        .print-preview-frame {
          width: 100% !important;
          height: 100% !important;
          min-height: 0 !important;
          border-radius: 0 !important;
          margin: 0 !important;
          page-break-after: always;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0"
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
